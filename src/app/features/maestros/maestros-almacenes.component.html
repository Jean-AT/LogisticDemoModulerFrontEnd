<app-page-header title="Maestros · Almacenes" subtitle="Catálogo de almacenes">
  <ng-container actions>
    <button mat-flat-button class="btn-primary" (click)="toggleForm()">
      <mat-icon>{{ showForm() ? 'close' : 'add' }}</mat-icon>
      {{ showForm() ? 'Cancelar' : 'Nuevo almacén' }}
    </button>
  </ng-container>
</app-page-header>

<div class="form-card card" *ngIf="showForm()">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Código</mat-label>
        <input matInput formControlName="code" placeholder="ALM-003" />
        <mat-error>{{ fieldError('code') || 'Codigo requerido' }}</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" />
        <mat-error>{{ fieldError('name') || 'Nombre requerido' }}</mat-error>
      </mat-form-field>
      <button mat-flat-button class="btn-primary" type="submit" [disabled]="form.invalid || saving()">
        <mat-icon>{{ saving() ? 'hourglass_top' : 'save' }}</mat-icon>
        Guardar
      </button>
    </div>
  </form>
</div>

<div class="card" *ngIf="!loading(); else loadingTpl">
  <div class="error-box" *ngIf="error()">
    <span>{{ error()!.detail }}</span>
    <button mat-stroked-button type="button" *ngIf="error()!.retryable" (click)="load()">Reintentar</button>
  </div>
  <app-empty-state *ngIf="almacenes().length === 0" title="Sin almacenes" subtitle="Aún no hay almacenes registrados." icon="warehouse" />
  <table mat-table [dataSource]="almacenes()" class="payload-table" *ngIf="almacenes().length > 0">
    <ng-container matColumnDef="code"><th mat-header-cell *matHeaderCellDef>Código</th><td mat-cell *matCellDef="let a" class="text-primary">{{ a.code }}</td></ng-container>
    <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Nombre</th><td mat-cell *matCellDef="let a">{{ a.name }}</td></ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>

<ng-template #loadingTpl>
  <div class="card" style="display:flex;justify-content:center;padding:40px;"><mat-spinner diameter="40" /></div>
</ng-template>
